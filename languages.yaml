# Translations for the Admin screens.
#
# Keys used by blueprints.yaml (plugin settings) come first in each language
# block, then the keys used by blueprints/pdf.yaml (the per-page tab).
#
# Contributions welcome: copy a block, translate the values, and change nothing
# else. Keys that are missing fall back to English, so a partial translation is
# perfectly usable.

en:
  PLUGIN_PDF:
    TAB: PDF
    SECTION: PDF export
    TOC: Contents
    COVER_ITEMS: articles

    INHERIT: Inherit from parent pages
    INHERIT_HELP: "Let a page inherit pdf: settings from its parents. This is what lets a listing switch on every article in it."
    ALL_PAGES: Export every page
    ALL_PAGES_HELP: "Off by default: a page opts in with pdf: { enabled: true } in its frontmatter."

    DOCUMENT: Document
    COVER: Cover page
    COVER_HELP: "A book starts with a cover page. A single article never gets one."
    TOC_ENABLED: Table of contents
    TOC_ENABLED_HELP: "A book gets a table of contents after the cover. A single article never gets one."
    TOC_DEPTH: Contents depth
    TOC_DEPTH_1: "Article titles only"
    TOC_DEPTH_2: "Article titles and headings within articles"
    PAGE_NUMBERS: Page numbers
    PAGE_NUMBERS_HELP: "Numbered footer on every page except the cover."
    DOC_TITLE: Title
    DOC_TITLE_HELP: "Used on the cover and in the PDF metadata. Empty means the page title."
    DATE_FORMAT: Date format
    DATE_FORMAT_HELP: "PHP date() format for every date the plugin prints: the dateline under each article title, the cover date and {TODAY}. E.g. d.m.Y."

    FURNITURE: Running header and footer
    HEADER: Header
    FOOTER: Footer
    HEADER_HELP: "HTML. Tokens: {LOGO} {SITE} {TITLE} {TODAY} {PAGENO} {NBPG}"
    LOGO: Logo
    LOGO_HELP: "A path to an image — theme://images/logo.svg, user://images/logo.png — or an upload, which is stored in user/plugins/pdf/logo/. Used by the {LOGO} token. Leave empty for no logo."

    IMAGES: Images
    IMAGES_ENABLED: Include images
    IMAGES_ENABLED_HELP: "Off by default: the PDF is text only. Turn this on to embed the leading image, the gallery and images inside the text."
    IMAGES_MAX: Maximum images
    IMAGES_PER_ARTICLE: per article
    IMAGES_WIDTH: Maximum width
    PIXELS: px
    IMAGES_QUALITY: JPEG quality
    IMAGE_FIELD: Leading image field
    IMAGE_FIELD_HELP: "The page header that holds the image to lead with, e.g. featuredImage. Empty uses the first page image."
    IMAGE_SKIP_FIELD: Skipped image field
    IMAGE_SKIP_FIELD_HELP: "The page header naming an image to leave out, e.g. author.avatarImage. Useful when the first page image is an avatar."
    GALLERY_FIELD: Gallery field
    GALLERY_FIELD_HELP: "The page header that, when true, means \"use every image on the page\". Empty disables gallery detection."

    META: Dateline
    META_PARTS: Parts of the dateline
    META_PARTS_HELP: "The line under each article title, in the order listed. A part with nothing to print is left out."
    META_DATE: Date
    META_CATEGORY: Category
    META_AUTHOR: Author
    META_TAXONOMY: Category taxonomy
    META_TAXONOMY_HELP: "Which taxonomy the category is read from. Standard Grav uses 'category'."
    META_AUTHOR_FIELD: Author field
    META_AUTHOR_FIELD_HELP: "The page header holding the author's name. A dotted path works, e.g. author.name. A list at that key is ignored."

    CONTENT: Content
    COLLECTION: Collection header
    COLLECTION_HELP: "The page header holding the collection to build a book from."
    CHILDREN: Without a collection
    CHILDREN_HELP: "What to use when the page has no collection at all."
    CHILDREN_DIRECT: Direct children only
    CHILDREN_DESCENDANTS: The whole subtree
    STRIP_SHORTCODES: Remove these shortcodes
    STRIP_SHORTCODES_HELP: "Shortcodes whose plugin is not installed would otherwise appear as literal text in the PDF."
    STRIP_SHORTCODES_PLACEHOLDER: "shortcode name"

    LAYOUT: Layout
    PAPER: Paper size
    ORIENTATION: Orientation
    PORTRAIT: Portrait
    LANDSCAPE: Landscape
    FONT_SIZE: Font size
    POINTS: pt
    FONT_BODY: Body font
    FONT_BODY_HELP: "The text, the tables, the dateline and the running header and footer. One of the four DejaVu faces mPDF carries, or a family you added with Font directory."
    FONT_HEADINGS: Heading font
    FONT_HEADINGS_HELP: "Headings h1–h6 and the document's own titles: the cover title, the contents heading and its lines. The running header and footer keep the body font, unless you write a heading in their HTML."
    FONT_SANS: Sans — DejaVu Sans
    FONT_SANS_CONDENSED: Sans condensed — DejaVu Sans Condensed
    FONT_SERIF: Serif — DejaVu Serif
    FONT_SERIF_CONDENSED: Serif condensed — DejaVu Serif Condensed
    FONT_DIR: Font directory
    FONT_DIR_HELP: "Where your own .ttf files live, e.g. user-data://pdf/fonts. Each family is read from its file names: MyFont-Regular.ttf, MyFont-Bold.ttf, MyFont-Italic.ttf, MyFont-BoldItalic.ttf. Then set Body font or Heading font to myfont."
    MARGINS: Margins
    MARGIN_TOP: Top
    MARGIN_BOTTOM: Bottom
    MARGIN_LEFT: Left
    MARGIN_RIGHT: Right
    MARGIN_HEADER: Header
    MARGIN_FOOTER: Footer

    ADVANCED: Advanced
    CACHE: Cache generated PDFs
    CACHE_TTL: Cache lifetime
    SECONDS: seconds
    CACHE_PATH: Cache directory
    CACHE_PATH_HELP: "Empty uses cache/pdf in Grav's cache directory, which bin/grav clear-cache empties. A stream, an absolute path or a Grav-relative path all work."
    MAX_ITEMS: Maximum articles in a book
    MAX_ITEMS_HELP: "0 means no limit."
    SHOW_COUNT: Add the article count to the button caption
    SHOW_COUNT_HELP: "The %count% placeholder. Costs an extra collection build on every page render."
    BOOK_LABEL: Button caption for a book
    ARTICLE_LABEL: Button caption for an article
    LABEL_HELP: "Empty uses the translation. %count% is the number of articles."

    PAGE_ENABLED: Offer a PDF of this page
    PAGE_ENABLED_HELP: "Nothing is generated or linked until this is on."
    PAGE_MODE: "Treat this page as"
    PAGE_MODE_HELP: "By default a page that holds a collection becomes a book, everything else a single article."
    MODE_AUTO: "Automatic"
    MODE_BOOK: "A book (cover, contents, one article per item)"
    MODE_ARTICLE: "A single article"
    PAGE_TITLE: Title
    PAGE_TITLE_HELP: "Used on the cover and in the PDF metadata."
    PAGE_DATE_FORMAT: Date format
    PAGE_COVER: Cover page
    PAGE_TOC: Table of contents
    PAGE_TOC_DEPTH: Contents depth
    PAGE_NUMBERS_ENABLED: Page numbers
    PAGE_IMAGES: Include images
    PAGE_IMAGES_HELP: "Off keeps the PDF text only."
    PAGE_IMAGES_MAX: Maximum images
    PAGE_HEADER: Header
    PAGE_FOOTER: Footer
    PAGE_HEADER_HELP: "HTML. Tokens: {LOGO} {SITE} {TITLE} {TODAY} {PAGENO} {NBPG}"
    PAGE_LOGO: Logo
    PAGE_LOGO_HELP: "Empty uses the plugin setting."
    PAGE_COLLECTION: Collection header
    PAGE_COLLECTION_HELP: "The page header holding the collection to build a book from."
    PAGE_CHILDREN: Without a collection
    PAGE_CHILDREN_HELP: "What to use when this page has no collection."
    PAGE_MAX_ITEMS: Maximum articles

