name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the minimum the blueprints declare; 8.3 is what this plugin is
        # developed on.
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Only the plugin's own code. `vendor/` is third-party, and the bundled
      # mPDF is pinned in composer.lock anyway.
      - name: Syntax check
        run: |
          find classes -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l pdf.php

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish --strict
